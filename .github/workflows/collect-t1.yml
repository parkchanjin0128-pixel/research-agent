name: collect-t1
on:
  push:
    branches: [claude/xc-collect]
    paths: [.github/workflows/collect-t1.yml, collect_t1.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {inst: [USA500IDXUSD, USDCNH, USDMXN, EURUSD, USDTRY]}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!data_raw/polymarket\n!data_raw/kalshi\n"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: timeout 22m python -u collect_t1.py ${{ matrix.inst }} 2>&1 | tee collect_t1_${{ matrix.inst }}.log || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_raw/dukascopy
          git add collect_t1_${{ matrix.inst }}.log
          git commit -q -m "Add 2018-2019 ${{ matrix.inst }} (Actions)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull -q --rebase origin claude/xc-collect && git push && break; sleep $((RANDOM % 20 + 5)); done
