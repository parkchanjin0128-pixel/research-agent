name: collect-pm
on:
  push:
    branches: [claude/xc-collect]
    paths: [.github/workflows/collect-pm.yml, collect_pm_fast.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: {src: [pm, ks]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: timeout 40m python -u collect_pm_fast.py ${{ matrix.src }} 2>&1 | tee collect_${{ matrix.src }}.log || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_raw collect_${{ matrix.src }}.log
          git commit -q -m "Add prediction-market data: ${{ matrix.src }} (Actions)" || echo "nothing to commit"
          for i in 1 2 3; do git pull -q --rebase origin claude/xc-collect && git push && break; sleep 10; done
