name: collect-pm
on:
  push:
    branches: [claude/xc-collect]
    paths: [.github/workflows/collect-pm.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect-pm
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: collect (resumable, stops itself before the job limit)
        run: timeout 320m python -u "collect data" --only polymarket,kalshi 2>&1 | tail -n 300 > collect_pm.log || true
      - name: commit whatever was collected
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_raw collect_pm.log
          git commit -q -m "Add prediction-market data (Actions)" || echo "nothing to commit"
          git pull -q --rebase origin claude/xc-collect && git push
